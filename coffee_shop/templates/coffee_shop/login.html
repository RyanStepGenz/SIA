{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Cozy Bean</title>
    <link rel="stylesheet" href="{% static 'coffee_shop/styles.css' %}">
</head>
<body class="staff-login-page">
    <main class="staff-login-card">
        <header class="staff-login-header">
            <h1>The Cozy Bean</h1>
            <p>Staff &amp; Manager Login</p>
        </header>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            {% if form.non_field_errors %}
                <div class="staff-login-error" role="alert">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="staff-login-field">
                <label for="{{ form.username.id_for_label }}">Username</label>
                {{ form.username }}
            </div>
            <div class="staff-login-field">
                <label for="{{ form.password.id_for_label }}">Password</label>
                {{ form.password }}
            </div>
            <button type="submit">Login</button>
        </form>
    </main>
</body>
</html>
